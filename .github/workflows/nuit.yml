name: Mise à jour de nuit
on:
  schedule:
    - cron: "17 2 * * *"   # chaque nuit (UTC)
  workflow_dispatch: {}     # bouton « Run workflow » pour la lancer à la main
permissions:
  contents: write
jobs:
  nuit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Garde-éveil, mauvais numéros et recherche intelligente
        env:
          PHONES_KEY: ${{ secrets.PHONES_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_MONTHLY_BUDGET: ${{ vars.GOOGLE_MONTHLY_BUDGET || '175' }}
          GOOGLE_NIGHT_CAP: ${{ vars.GOOGLE_NIGHT_CAP || '400' }}
        run: npx --yes tsx scripts/nightly.mts
      - name: Publier si quelque chose a changé
        run: |
          if [ -n "$(git status --porcelain docs data)" ]; then
            git config user.name "uptimise-nuit"
            git config user.email "nuit@users.noreply.github.com"
            git add docs data
            git commit -m "Mise à jour de nuit : numéros ajustés à l'activité de l'équipe"
            git push
          else
            echo "Aucun changement."
          fi
